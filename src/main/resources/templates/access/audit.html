<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page('감사 기록', ~{::main})}">
<body>
<main class="stack">
  <div class="page-head">
    <div>
      <h1>감사 기록</h1>
      <p class="muted">권한 정책의 변경과 거부된 요청이 남습니다. 최근 200건을 보여 줍니다.</p>
    </div>
  </div>
  <section class="card">
    <p class="empty" th:if="${events.isEmpty()}">기록이 없습니다.</p>
    <div class="table-wrap" th:unless="${events.isEmpty()}">
      <table>
        <thead><tr><th>시각</th><th>종류</th><th>실행한 사람</th><th>대상</th><th>권한</th><th>결과</th><th class="num">정책 버전</th></tr></thead>
        <tbody>
        <tr th:each="event : ${events}">
          <td class="nowrap muted" th:text="${@fmt.dateTime(event.occurredAt())}">시각</td>
          <td><code class="small" th:text="${event.eventType()}">종류</code></td>
          <td class="nowrap" th:text="${@names.of(event.actorAccountId())}">이름</td>
          <td class="nowrap muted" th:text="${@names.of(event.targetAccountId())}">대상</td>
          <td><code class="small muted" th:text="${event.permissionKey()}">권한</code></td>
          <td>
            <span class="badge" th:if="${event.decision() != null}" th:classappend="${event.decision() == 'ALLOW'} ? 'ok' : 'bad'" th:text="${event.decision()}">결과</span>
            <span class="small muted" th:text="${event.reasonCode()}">사유</span>
          </td>
          <td class="num muted" th:text="${event.policyVersion()}">1</td>
        </tr>
        </tbody>
      </table>
    </div>
  </section>
</main>
</body>
</html>
