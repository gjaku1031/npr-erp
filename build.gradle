import org.jooq.meta.jaxb.Logging

plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.jooq.jooq-codegen-gradle' version '3.21.7'
}

group = 'com.npr'
version = '0.2.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

springBoot {
    buildInfo()
}

bootJar {
    archiveFileName = 'npr-erp.jar'
}

repositories {
    mavenCentral()
}

ext {
    springModulithVersion = '2.1.1'
}

// 통합 테스트용 임베디드 PostgreSQL 바이너리는 실행 환경의 OS·CPU에 맞는 것 하나만 받음
def embeddedPostgresBinary = {
    def os = System.getProperty('os.name').toLowerCase()
    def arch = System.getProperty('os.arch').toLowerCase()
    def arm = arch in ['aarch64', 'arm64']
    def amd = arch in ['amd64', 'x86_64']
    if (os.contains('linux') && amd) return 'linux-amd64'
    if (os.contains('linux') && arm) return 'linux-arm64v8'
    if (os.contains('mac') && amd) return 'darwin-amd64'
    if (os.contains('mac') && arm) return 'darwin-arm64v8'
    return null
}()

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-jackson'
    implementation 'org.springframework.boot:spring-boot-starter-jooq'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springframework.modulith:spring-modulith-starter-core'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    runtimeOnly 'org.postgresql:postgresql'

    jooqCodegen 'org.jooq:jooq-meta-extensions:3.21.7'
    jooqCodegen 'com.h2database:h2'

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-jooq-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
    testImplementation 'io.zonky.test:embedded-postgres:2.2.2'
    testImplementation platform('io.zonky.test.postgres:embedded-postgres-binaries-bom:18.3.0')
    if (embeddedPostgresBinary != null) {
        testImplementation "io.zonky.test.postgres:embedded-postgres-binaries-${embeddedPostgresBinary}"
    }
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.modulith:spring-modulith-bom:${springModulithVersion}"
    }
}

def jooqOutput = layout.buildDirectory.dir('generated-sources/jooq')

sourceSets {
    main {
        java {
            srcDir jooqOutput
        }
    }
}

jooq {
    configuration {
        logging = Logging.WARN
        generator {
            database {
                name = 'org.jooq.meta.extensions.ddl.DDLDatabase'
                includes = '.*'
                excludes = 'flyway_schema_history'
                // DDLDatabase는 H2로 마이그레이션을 해석하므로 스키마 이름 없는 테이블을 생성해 실행 시 PostgreSQL의 기본 스키마를 쓰게 함
                outputSchemaToDefault = true
                properties {
                    property {
                        key = 'scripts'
                        value = 'src/main/resources/db/migration/*.sql'
                    }
                    property {
                        key = 'sort'
                        value = 'flyway'
                    }
                    property {
                        key = 'defaultNameCase'
                        value = 'lower'
                    }
                }
            }
            generate {
                deprecated = false
                records = true
                fluentSetters = true
                // 자기 참조 외래 키(storage_node.parent_id)의 암시적 조인 경로는 이름이 충돌하므로 생성하지 않음
                implicitJoinPathsToOne = false
                implicitJoinPathsToMany = false
                implicitJoinPathsManyToMany = false
            }
            target {
                packageName = 'com.npr.generated.jooq'
                directory = jooqOutput.get().asFile.path
            }
        }
    }
}

tasks.named('compileJava') {
    dependsOn tasks.named('jooqCodegen')
    options.compilerArgs += ['-parameters', '-Xlint:deprecation']
}

tasks.named('compileTestJava') {
    options.compilerArgs += ['-parameters']
}

// 단위 테스트: DB 없이 도는 정책·구조 검사
tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'integration'
    }
}

// 통합 테스트: 실제 PostgreSQL에서 Flyway·JPA·jOOQ·동시성 검사
def integrationTest = tasks.register('integrationTest', Test) {
    description = 'PostgreSQL과 전체 컨텍스트를 쓰는 통합 테스트 실행'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'integration'
    }
    shouldRunAfter tasks.named('test')
}

tasks.named('check') {
    dependsOn integrationTest
}

// DB를 따로 띄우지 않고 시연 데이터가 든 서버를 실행
tasks.register('demoRun', JavaExec) {
    group = 'application'
    description = 'Runs the server with embedded PostgreSQL and demo data.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.npr.erp.DemoServer'
}
