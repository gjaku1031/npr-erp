services:
  postgres:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_DB: npr_erp
      POSTGRES_USER: npr
      POSTGRES_PASSWORD: npr-local-only
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U npr -d npr_erp"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      # PostgreSQL 18은 버전별 클러스터를 /var/lib/postgresql 아래에 저장함
      - npr-postgres-data:/var/lib/postgresql

volumes:
  npr-postgres-data:
